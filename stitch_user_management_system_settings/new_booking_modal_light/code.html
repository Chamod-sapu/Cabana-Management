<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Create New Booking</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<!-- Blurred Background Overlay -->
<div class="fixed inset-0 z-0 bg-slate-900/20 backdrop-blur-sm flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-xl shadow-2xl overflow-hidden flex flex-col">
<!-- Header -->
<header class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 px-6 py-4">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-8 bg-primary/10 rounded-lg text-primary">
<span class="material-symbols-outlined text-xl">event_available</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight">Create New Booking</h2>
</div>
<button class="flex items-center justify-center rounded-lg size-10 bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto p-6 space-y-6">
<!-- Cabana Selection -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Select Cabana</label>
<div class="relative">
<select class="form-select w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 h-12 focus:ring-primary focus:border-primary appearance-none px-4">
<option value="">Choose Cabana 1-4</option>
<option value="1">Cabana 1 (Poolside)</option>
<option value="2">Cabana 2 (Garden View)</option>
<option value="3">Cabana 3 (Ocean Front)</option>
<option value="4">Cabana 4 (Premium Suite)</option>
</select>
<div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined">unfold_more</span>
</div>
</div>
</div>
<!-- Inline Calendar -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Select Date</label>
<div class="border border-slate-200 dark:border-slate-700 rounded-lg p-4 bg-slate-50 dark:bg-slate-800/50">
<div class="flex items-center justify-between mb-4">
<button class="p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded transition-colors text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<p class="text-slate-900 dark:text-slate-100 font-bold">October 2023</p>
<button class="p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded transition-colors text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-7 text-center text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">
<span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
</div>
<div class="grid grid-cols-7 gap-1">
<!-- Empty cells for padding -->
<div class="h-10"></div><div class="h-10"></div><div class="h-10"></div>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">1</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">2</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">3</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">4</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm bg-primary text-white font-bold shadow-md shadow-primary/30">5</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">6</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">7</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">8</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">9</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">10</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">11</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">12</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">13</button>
<button class="h-10 flex items-center justify-center rounded-lg text-sm text-slate-600 dark:text-slate-400 hover:bg-primary/10 transition-colors">14</button>
</div>
</div>
</div>
<!-- Time Inputs -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Start Time</label>
<div class="relative">
<input class="form-input w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 h-12 focus:ring-primary focus:border-primary pl-10" placeholder="09:00 AM" type="text" value="09:00 AM"/>
<div class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-xl">schedule</span>
</div>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">End Time</label>
<div class="relative">
<input class="form-input w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 h-12 focus:ring-primary focus:border-primary pl-10" placeholder="05:00 PM" type="text" value="05:00 PM"/>
<div class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-xl">schedule</span>
</div>
</div>
</div>
</div>
<!-- Pricing & Subtotal Card -->
<div class="bg-primary/5 dark:bg-primary/10 rounded-xl p-4 border border-primary/10">
<div class="flex justify-between items-center text-sm text-slate-600 dark:text-slate-400 mb-2">
<span>Rate per hour</span>
<span class="font-medium text-slate-900 dark:text-slate-100">$45.00</span>
</div>
<div class="flex justify-between items-center text-sm text-slate-600 dark:text-slate-400 mb-4">
<span>Total duration</span>
<span class="font-medium text-slate-900 dark:text-slate-100">8 Hours</span>
</div>
<div class="pt-3 border-t border-primary/10 flex justify-between items-end">
<div class="flex flex-col">
<span class="text-xs uppercase tracking-wider font-bold text-primary">Subtotal</span>
<span class="text-2xl font-bold text-slate-900 dark:text-slate-100 leading-none">$360.00</span>
</div>
<span class="text-xs text-slate-500 dark:text-slate-400 italic">*Includes service fees</span>
</div>
</div>
</div>
<!-- Action Footer -->
<footer class="p-6 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 flex flex-col gap-3">
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-bold rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">verified</span>
                    Check Availability
                </button>
<p class="text-center text-xs text-slate-500 dark:text-slate-400">
                    You won't be charged yet.
                </p>
</footer>
</div>
</div>
</body></html>
